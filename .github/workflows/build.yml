name: Build APK

on:
  push:
    branches: [main, next]
    # Only documents changed: nothing to build or release.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

# Nothing gets write access unless a job asks for it below
permissions:
  contents: read

jobs:
  # Builds and tests. Runs third-party build code, so it gets no secrets and no write access.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # To check the PDF engine's build attestation (read only)
      attestations: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < version.txt)"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$' || { echo "::error::version.txt must be major.minor.patch (minor and patch below 100), got '$V'"; exit 1; }
          # A push to main becomes a release: stop here, before any approval, if this version is already out.
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ] \
             && gh api "repos/${{ github.repository }}/releases/tags/v$V" >/dev/null 2>&1; then
            echo "::error::v$V is already released; raise version.txt first."; exit 1
          fi

      # The PDF engine in the repository must be byte for byte the attested release build
      - name: Verify PDFium
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REL="$(tr -d '[:space:]' < pdfium/RELEASE)"
          mkdir -p /tmp/pdfium && cd /tmp/pdfium
          curl -fsSL -o a.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/${REL/\//%2F}/pdfium-android-arm64.tgz"
          curl -fsSL -o x.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/${REL/\//%2F}/pdfium-android-x64.tgz"
          for f in a.tgz x.tgz; do
            gh attestation verify "$f" --repo bblanchon/pdfium-binaries \
              --signer-workflow bblanchon/pdfium-binaries/.github/workflows/build-all.yml --source-ref refs/heads/master > /dev/null
          done
          mkdir a x && tar -xzf a.tgz -C a && tar -xzf x.tgz -C x
          cmp a/lib/libpdfium.so "$GITHUB_WORKSPACE/pdfium/lib/arm64-v8a/libpdfium.so"
          cmp x/lib/libpdfium.so "$GITHUB_WORKSPACE/pdfium/lib/x86_64/libpdfium.so"
          echo "PDFium matches the attested $REL build"

      # Text recognition models: exactly the files described in SOURCES.json
      - name: Verify OCR models
        run: (cd app/src/main/assets/ocr && sha256sum -c SHA256SUMS)

      # Handwriting model Р2: exactly the file made by the rukopys workflow (SOURCES.json)
      - name: Verify handwriting model
        run: (cd app/src/main/assets/ink && sha256sum -c SHA256SUMS)

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"

      - name: Test and build (unsigned)
        shell: bash
        run: |
          set -o pipefail
          # Every library is checked against gradle/verification-metadata.xml (refreshed only by deps.yml);
          # the build fails on any changed library, and without the file.
          test -f gradle/verification-metadata.xml || { echo "gradle/verification-metadata.xml is missing" | tee build.log; exit 1; }
          gradle --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Check permissions (no internet, only what is expected)
        shell: bash
        run: bash .github/check-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk

      # Accuracy report: LibreOffice renders the same test documents (with the same free fonts);
      # the difference per page goes to the log. A report for now, not a gate.
      - name: Compare rendering with LibreOffice
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -e
          test -d app/build/render || { echo "no renders"; exit 0; }
          sudo apt-get -o DPkg::Lock::Timeout=600 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y -qq --no-install-recommends libreoffice-writer-nogui libreoffice-impress-nogui fonts-crosextra-carlito \
            fonts-crosextra-caladea fonts-liberation poppler-utils python3-pil > /dev/null
          mkdir -p ref
          soffice --headless --convert-to pdf --outdir ref app/src/test/resources/docs/*.docx > /dev/null
          for f in ref/*.pdf; do pdftoppm -r 150 -png "$f" "ref/$(basename "$f" .pdf)"; done
          python3 scripts/compare_render.py app/build/render ref render-report
          # Slides against LibreOffice
          if [ -d app/build/render-slides ]; then
            mkdir -p ref-slides
            soffice --headless --convert-to pdf --outdir ref-slides app/src/test/resources/slides/*.pptx > /dev/null
            for f in ref-slides/*.pdf; do pdftoppm -scale-to-x 1600 -scale-to-y -1 -png "$f" "ref-slides/$(basename "$f" .pdf)"; done
            python3 scripts/compare_render.py app/build/render-slides ref-slides render-report-slides
            # The .ppt copy against our PPTX pages: the reader is what differs
            [ -d app/build/render-slides-ppt ] && python3 scripts/compare_render.py app/build/render-slides-ppt app/build/render-slides render-report-ppt || true
          fi
          # Old Word files (the same test documents saved as .doc) against LibreOffice too
          if [ -d app/build/render-doc ]; then
            mkdir -p ref-doc
            soffice --headless --convert-to pdf --outdir ref-doc app/src/test/resources/docs-doc/*.doc > /dev/null
            for f in ref-doc/*.pdf; do pdftoppm -r 150 -png "$f" "ref-doc/$(basename "$f" .pdf)"; done
            python3 scripts/compare_render.py app/build/render-doc ref-doc render-report-doc
            # And against our own DOCX pages of the same documents: the reader, not the layout, is what differs
            python3 scripts/compare_render.py app/build/render-doc app/build/render render-report-doc-vs-docx
          fi

      # Documents saved by the editor (in the tests) must open elsewhere: every XML part well formed,
      # and LibreOffice turns each into pages. A gate: a file the editor broke fails the build.
      - name: Edited documents open in LibreOffice
        if: success()
        timeout-minutes: 10
        shell: bash
        run: |
          set -e
          test -d app/build/edited || { echo "no edited documents"; exit 1; }
          python3 - <<'PY'
          import glob, zipfile, xml.dom.minidom, sys
          bad = 0
          for f in glob.glob("app/build/edited/*.docx") + glob.glob("app/build/edited/*.xlsx") + glob.glob("app/build/edited/*.pptx"):
              z = zipfile.ZipFile(f)
              for n in z.namelist():
                  if n.endswith(".xml") or n.endswith(".rels"):
                      try: xml.dom.minidom.parseString(z.read(n))
                      except Exception as e: print(f, n, e); bad += 1
          sys.exit(1 if bad else 0)
          PY
          dpkg -s libreoffice-calc-nogui libreoffice-impress-nogui > /dev/null 2>&1 || { sudo apt-get -o DPkg::Lock::Timeout=600 update -qq; sudo apt-get -o DPkg::Lock::Timeout=600 install -y -qq --no-install-recommends libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui poppler-utils > /dev/null; }
          mkdir -p edited-pdf log/edited
          soffice --headless --convert-to pdf --outdir edited-pdf app/build/edited/*.docx app/build/edited/*.xlsx app/build/edited/*.pptx > /dev/null
          for f in app/build/edited/*.docx app/build/edited/*.xlsx app/build/edited/*.pptx; do
            b="$(basename "$f")"; pdf="edited-pdf/${b%.*}.pdf"
            test -s "$pdf" || { echo "LibreOffice could not open $f"; exit 1; }
            pdftoppm -r 60 -png -f 1 -l 1 "$pdf" "log/edited/${b%.*}" || true
            # Presentations whose slides were added or taken out: LibreOffice sees as many as the test expects
            if [ -f "${f%.*}.pages" ]; then
              want="$(cat "${f%.*}.pages")"; got="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
              [ "$want" = "$got" ] || { echo "$f: LibreOffice shows $got slides, expected $want"; exit 1; }
              pdftoppm -r 40 -png "$pdf" "log/edited/${b%.*}-all" || true
            fi
          done
          echo "edited documents open: $(ls edited-pdf | wc -l)"

      - name: Prepare build log
        if: always()
        shell: bash
        run: |
          mkdir -p log
          { echo "run ${{ github.run_number }} ${{ job.status }}"; grep -E "^e: |error:|FAILED|What went wrong|Dependency verification" -A3 build.log | head -300; echo ----; tail -150 build.log; cat permissions.txt 2>/dev/null; } > log/build.log || true
          find app/build/test-results -name "*.xml" -exec cp {} log/ \; 2>/dev/null || true
          cp gradle/verification-metadata.xml log/ 2>/dev/null || true
          # Pictures of the screens drawn with made-up documents, for review
          cp -r app/build/screens log/screens 2>/dev/null || true
          # Page renders of the test documents and the comparison with LibreOffice
          cp -r render-report log/render 2>/dev/null || cp -r app/build/render log/render 2>/dev/null || true
          cp -r render-report-doc log/render-doc 2>/dev/null || cp -r app/build/render-doc log/render-doc 2>/dev/null || true
          cp app/build/render-doc/*.txt log/render-doc/ 2>/dev/null || true
          cp render-report-doc-vs-docx/report.md log/render-doc/vs-docx.md 2>/dev/null || true
          cp -r app/build/render-doc-word log/render-doc-word 2>/dev/null || true
          cp -r render-report-slides log/render-slides 2>/dev/null || cp -r app/build/render-slides log/render-slides 2>/dev/null || true
          cp -r render-report-ppt log/render-ppt 2>/dev/null || cp -r app/build/render-slides-ppt log/render-ppt 2>/dev/null || true
          cp app/build/render/*.txt log/render/ 2>/dev/null || true
          cp app/build/big/report.txt log/big-report.txt 2>/dev/null || true
          # The first errors as annotations, so they show on the pull request without opening the log.
          { grep -E "^e: |What went wrong|FAILED|AssertionError|expected:|PROBLEM:" -A2 build.log 2>/dev/null | grep -v "^--$" | head -15 \
            | sed -E 's/%/%25/g' | while IFS= read -r l; do echo "::warning title=build::$l"; done; } || true
          grep -h -o -E '<failure message="[^"]{0,300}' app/build/test-results/*/*.xml 2>/dev/null | head -5 \
            | while IFS= read -r l; do echo "::warning title=test::${l#<failure message=\"}"; done || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-log
          path: log/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hramota-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  # Saves the build log to the ci-logs branch. Runs no project code.
  logs:
    needs: build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-log
          path: log
      - name: Push the log
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd log
          git init -q && git checkout -q -b ci-logs && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "build log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" ci-logs

  # Signs. Only for main, only in the "release" environment (needs the owner's approval), and with
  # no Gradle or other third-party build code: just the Android SDK's own zipalign and apksigner.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check that signing secrets exist
        id: secrets
        env:
          PASS: ${{ secrets.HRAMOTA_SIGNING_PASS }}
          STORE: ${{ secrets.HRAMOTA_STORE_PASS }}
          KEYSTORE: ${{ secrets.HRAMOTA_KEYSTORE }}
        run: |
          if [ -n "$PASS" ] && [ -n "$STORE" ] && [ -n "$KEYSTORE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Signing secrets are not set in the release environment; nothing is published."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
          sparse-checkout: |
            signing
            .github

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: hramota-unsigned
          path: unsigned

      # The build job ran third-party code: check the APK's permissions again here, before signing,
      # in a step that has no secrets.
      - name: Check permissions again
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: bash .github/check-permissions.sh unsigned/app-release-unsigned.apk

      - name: Sign
        if: steps.secrets.outputs.ready == 'true'
        env:
          PASS: ${{ secrets.HRAMOTA_SIGNING_PASS }}
          STORE: ${{ secrets.HRAMOTA_STORE_PASS }}
          KEYSTORE: ${{ secrets.HRAMOTA_KEYSTORE }}
        shell: bash
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          printf %s "$PASS" > "$RUNNER_TEMP/p"
          # The key is kept only in the release environment's secrets (encrypted, as base64), never in the repository
          printf %s "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/k.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$RUNNER_TEMP/k.enc" -out "$RUNNER_TEMP/hramota.jks" -pass file:"$RUNNER_TEMP/p"
          rm "$RUNNER_TEMP/p" "$RUNNER_TEMP/k.enc"
          mkdir -p out
          "$BT/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          OUT="out/hramota-$(tr -d '[:space:]' < version.txt).apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/hramota.jks" --ks-key-alias hramota \
            --ks-pass env:STORE --key-pass env:STORE --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/hramota.jks"
          # The certificate must be exactly Hramota's own (signing/certificate-sha256.txt)
          CERT="$(tr -d '[:space:]' < signing/certificate-sha256.txt)"
          echo "$CERT" | grep -Eqi '^[0-9a-f]{64}$' || { echo "::error::signing/certificate-sha256.txt is not a SHA-256 digest"; exit 1; }
          "$BT/apksigner" verify --print-certs "$OUT" | tee certs.txt
          if ! tr -d ' ' < certs.txt | grep -qi "SHA-256digest:$CERT"; then
            echo "::error::Unexpected signing certificate"; exit 1
          fi

      - name: Remove the decrypted key
        if: always()
        run: rm -f "$RUNNER_TEMP/hramota.jks" "$RUNNER_TEMP/p" "$RUNNER_TEMP/k.enc"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: hramota-signed
          path: out/*.apk

  # Publishes the signed APK. Never sees the signing key; uses only GitHub's own gh tool.
  publish:
    needs: release
    if: needs.release.outputs.signed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            .github/release-notes.md
            version.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hramota-signed
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The same version can be released only once: the tag already exists otherwise.
          V="$(tr -d '[:space:]' < version.txt)"
          gh release create "v$V" out/*.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Hramota $V" --notes-file .github/release-notes.md --latest
