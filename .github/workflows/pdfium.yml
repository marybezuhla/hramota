name: Prepare PDFium

# Run by hand (or by pushing the pdfium-prepare branch). Downloads PDFium for Android from
# bblanchon/pdfium-binaries at a fixed release, checks GitHub's build attestation (the file was built
# by that repository's own workflow), and pushes the library, headers, licenses and SHA256SUMS to the
# pdfium branch for review. Nothing goes into the app until reviewed and copied by hand.
# The build without V8 is used on purpose: PDF JavaScript cannot run at all.
on:
  workflow_dispatch:
  push:
    branches: [pdfium-prepare]

permissions:
  contents: read

env:
  RELEASE: chromium/8125

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download and verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dl out
          for abi in arm64 x64; do
            f="pdfium-android-$abi.tgz"
            curl -fsSL -o "dl/$f" "https://github.com/bblanchon/pdfium-binaries/releases/download/${RELEASE/\//%2F}/$f"
            # Built by bblanchon/pdfium-binaries' own release workflow, or stop here
            gh attestation verify "dl/$f" --repo bblanchon/pdfium-binaries | tee -a out/attestation.txt
            mkdir -p "x/$abi" && tar -xzf "dl/$f" -C "x/$abi"
          done
          (cd dl && sha256sum *.tgz) > out/SHA256SUMS-tgz
          mkdir -p out/lib/arm64-v8a out/lib/x86_64
          cp x/arm64/lib/libpdfium.so out/lib/arm64-v8a/
          cp x/x64/lib/libpdfium.so out/lib/x86_64/
          cp -R x/arm64/include out/include
          cp x/arm64/LICENSE out/LICENSE
          cp -R x/arm64/licenses out/licenses 2>/dev/null || true
          cat x/arm64/VERSION > out/VERSION 2>/dev/null || echo "$RELEASE" > out/VERSION
          echo "$RELEASE" > out/RELEASE
          (cd out && find lib -name '*.so' -exec sha256sum {} \;) > out/SHA256SUMS
          ls -laR out | head -80
          # Exported symbols, for review
          nm -D --defined-only out/lib/arm64-v8a/libpdfium.so | awk '{print $3}' | sort > out/symbols.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfium
          path: out/

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdfium
          path: out
      - name: Push for review
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q && git checkout -q -b pdfium && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "PDFium $(cat RELEASE)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" pdfium
