name: Rukopys model

# Trains the handwriting model (rukopys/) on made-up writing and compares it with the first way of
# reading (Р1) on fonts it never saw. Started by hand; the model and its report go to the
# rukopys-model branch, nowhere else. Nothing here touches the app or its releases.
on:
  # A push to rukopys-smoke checks the whole way in minutes; to rukopys-train trains for real
  push:
    branches: [rukopys-smoke, rukopys-train]
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours of training"
        default: "4"
      lines:
        description: "Lines of made-up writing to train on"
        default: "150000"

permissions:
  contents: read

jobs:
  # Runs third-party code (PyTorch and others from PyPI): no secrets, no write access.
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install --quiet numpy==2.1.3 scikit-image==0.24.0 pillow==11.0.0 fonttools==4.55.0 onnx==1.17.0 onnxruntime==1.20.1
      - name: Fonts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv/bin/python rukopys/synth/fonts.py fonts
      - name: Train
        env:
          HOURS: ${{ inputs.hours || (github.ref_name == 'rukopys-smoke' && '0.03' || '4.5') }}
          LINES: ${{ inputs.lines || (github.ref_name == 'rukopys-smoke' && '3000' || '150000') }}
        run: .venv/bin/python -u rukopys/train/train.py --fonts fonts --hours "$HOURS" --train-n "$LINES" --val-n "$(( LINES < 30000 ? 200 : 1500 ))" --out out
      - name: Compare with Р1
        run: .venv/bin/python rukopys/eval/compare.py out > out/report.json && head -c 2000 out/report.json
      - name: Keep
        run: |
          mkdir -p keep
          cp out/rukopys.onnx out/rukopys_alphabet.txt out/report.json out/train.json fonts/fonts.json keep/
          cp -r fonts/licenses keep/font-licenses
          sha256sum keep/rukopys.onnx > keep/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rukopys-model
          path: keep

  # Puts the model on its branch. Runs no project or third-party code.
  publish:
    needs: train
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rukopys-model
          path: model
      - name: Push
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd model
          if [ "${{ github.ref_name }}" = rukopys-smoke ]; then BRANCH=rukopys-model-smoke; else BRANCH=rukopys-model; fi
          git init -q && git checkout -q -b "$BRANCH" && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "rukopys model, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" "$BRANCH"
