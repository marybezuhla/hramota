name: Voice samples

# Samples of the candidate reading voices, to choose by ear; nothing here goes into the app.
on:
  push:
    branches: [next]
    paths: ["tools/voices/**", ".github/workflows/voices.yml"]

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read with each voice
        run: |
          sudo apt-get install -y -q ffmpeg >/dev/null
          python3 -m pip install -q --user "piper-tts==1.3.0" onnx ukrainian-word-stress
          mkdir -p out
          bash tools/voices/stress.sh | tee out/stress.txt
          python3 tools/voices/samples.py | tee out/log.txt
          python3 tools/voices/stressed.py
          python3 tools/voices/g2p.py
          python3 tools/voices/prominence.py | tee out/prominence.txt
      - name: Push the samples
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q && git checkout -q -b voice-samples && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "voice samples ${{ github.run_number }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" voice-samples
