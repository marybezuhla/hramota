name: Voice samples (ESPnet)

# The ESPnet Ukrainian voices, to compare by ear; nothing here goes into the app.
on:
  push:
    branches: [next]
    paths: ["tools/voices/robinhad.py", "tools/voices/export_espnet.py", ".github/workflows/voices2.yml"]

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The project's dependencies build on Python 3.10, not on the runner's newer one
    container: python:3.10-bookworm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read
        run: |
          apt-get update -q >/dev/null && apt-get install -y -q ffmpeg git >/dev/null
          python3 -m pip install -q torch torchaudio --extra-index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q "git+https://github.com/robinhad/ukrainian-tts.git" onnx onnxruntime espnet_onnx
          mkdir -p out
          python3 -u tools/voices/export_espnet.py 2>&1 | tee out/export.txt
          rm -f out/*.wav
      - name: Push the samples
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git config --global --add safe.directory '*'
          git init -q && git checkout -q -b voice-samples-espnet && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "voice samples ${{ github.run_number }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" voice-samples-espnet
